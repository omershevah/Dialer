org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# DataStore and kotlinx are AndroidX-era libraries, the rest of the app uses the pre-AndroidX
# support library (like the platform build). Jetifier must stay off so the support library is not
# rewritten.
android.useAndroidX=true
android.enableJetifier=false

# Dialer code switches on resource IDs, which needs compile-time constant R fields.
android.nonFinalResIds=false

kotlin.code.style=official
