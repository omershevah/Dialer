name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships an Android SDK (ANDROID_HOME) with licenses accepted; Gradle
      # downloads the platform and build tools it needs into it.

      - uses: gradle/actions/setup-gradle@v4

      # Release signing key, from repository secrets (see BUILDING.md). Without them the APK is
      # signed with a throwaway debug key and can't be installed over a previous build.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DIALER_KEYSTORE_BASE64 }}
          DIALER_KEYSTORE_PASSWORD: ${{ secrets.DIALER_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::DIALER_KEYSTORE_BASE64 is not set; the APK is signed with a debug key"
            exit 0
          fi
          # Copying a long value often adds line breaks or spaces; base64 has none.
          clean=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
          echo "DIALER_KEYSTORE_BASE64: ${#clean} characters after removing whitespace"
          bad=$(printf '%s' "$clean" | tr -d 'A-Za-z0-9+/=' | wc -c)
          if [ "$bad" -ne 0 ]; then
            echo "::error::DIALER_KEYSTORE_BASE64 contains $bad characters that are not base64. Paste only the long encoded line, with nothing before or after it."
            exit 1
          fi
          if ! printf '%s' "$clean" | base64 -d > "$RUNNER_TEMP/dialer.jks" 2>/dev/null; then
            echo "::error::DIALER_KEYSTORE_BASE64 is incomplete (${#clean} characters). Paste the whole line again."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/dialer.jks" -storepass "$DIALER_KEYSTORE_PASSWORD" -alias dialer > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened. Check DIALER_KEYSTORE_PASSWORD, and that DIALER_KEYSTORE_BASE64 is the complete value."
            exit 1
          fi
          keytool -list -v -keystore "$RUNNER_TEMP/dialer.jks" -storepass "$DIALER_KEYSTORE_PASSWORD" -alias dialer | grep 'SHA256:'
          echo "DIALER_KEYSTORE_FILE=$RUNNER_TEMP/dialer.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          DIALER_KEYSTORE_PASSWORD: ${{ secrets.DIALER_KEYSTORE_PASSWORD }}
          DIALER_KEY_ALIAS: dialer
        run: ./gradlew assembleRelease --stacktrace --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      # Fails if the APK is missing what the platform build would put in it.
      - name: Verify APK
        run: |
          APK=build/outputs/apk/release/Dialer-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ls -l "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E '^(package|sdkVersion|minSdkVersion|targetSdkVersion|application:|launchable-activity)'
          "$BT/apksigner" verify --print-certs "$APK" | grep -E 'certificate (DN|SHA-256)'
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          for tag in activity service receiver provider uses-permission; do
            echo "$tag: $(grep -c "E: $tag " manifest.txt)"
          done
          missing=0
          for name in com.android.dialer.main.impl.MainActivity com.android.incallui.InCallActivity \
                      com.android.incallui.InCallServiceImpl com.android.dialer.binary.aosp.AospDialerApplication; do
            grep -q "\"$name\"" manifest.txt || { echo "::error::manifest is missing $name"; missing=1; }
          done
          # Nothing that must be unique on the device may still use the system Dialer's names.
          if ! "$BT/aapt2" dump badging "$APK" | grep -q "name='com.android.dialer'"; then
            if grep -E 'authorities|"com\.android\.dialer\.permission' manifest.txt | grep -q 'com\.android\.dialer\.'; then
              grep -E 'authorities|"com\.android\.dialer\.permission' manifest.txt
              echo "::error::manifest still uses com.android.dialer provider or permission names"; missing=1
            fi
          fi
          unzip -o -q "$APK" 'classes*.dex' -d dex
          echo "dex files: $(ls dex | wc -l)"
          for cls in com/android/dialer/binary/aosp/DaggerAospDialerRootComponent \
                     com/bumptech/glide/GeneratedAppGlideModuleImpl \
                     com/android/dialer/app/R\$string com/android/incallui/R\$layout \
                     com/android/dialer/callrecord/CallRecordingPreferences \
                     com/google/android/libraries/backup/PersistentBackupAgentHelper; do
            cat dex/*.dex | grep -aq "L$cls;" || { echo "::error::APK is missing class $cls"; missing=1; }
          done
          exit $missing

      # Surface compiler errors as annotations so they show up on the commit's checks.
      - name: Report build errors
        if: failure()
        run: |
          grep -E '(^e: |: error: |^ERROR:|FAILURE:|What went wrong|^> |Could not )' build.log \
            | grep -v '^> Task' | head -50 > errors.txt || true
          sed -n '1,10p' errors.txt | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
          sed -n '11,20p' errors.txt | sed 's/%/%25/g' | while IFS= read -r line; do echo "::warning::$line"; done
          sed -n '21,30p' errors.txt | sed 's/%/%25/g' | while IFS= read -r line; do echo "::notice::$line"; done
          { echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: Dialer
          path: build/outputs/apk/release/*.apk
